# Icone di Rokko; le immagini si rigenerano con tool/generate_icons.py.
flutter_launcher_icons:
  image_path: "assets/icon/icon.png"
  android: true
  adaptive_icon_background: "#F2994A"
  adaptive_icon_foreground: "assets/icon/foreground.png"
  adaptive_icon_monochrome: "assets/icon/monochrome.png"
  min_sdk_android: 21
  ios: true
  remove_alpha_ios: true
  image_path_ios_dark_transparent: "assets/icon/dark.png"
  image_path_ios_tinted_grayscale: "assets/icon/tinted.png"
  desaturate_tinted_to_grayscale_ios: true
  adaptive_icon_foreground_inset: 0
