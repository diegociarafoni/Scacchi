# Hook git locali (https://lefthook.dev): i controlli veloci prima del commit,
# tutto il resto in CI. Installazione: docs/convenzioni-git.md.
pre-commit:
  parallel: true
  jobs:
    - name: formattazione
      glob: "*.dart"
      exclude: "third_party/*"
      run: dart format --output=none --set-exit-if-changed {staged_files}
    - name: analisi statica
      glob: "*.{dart,yaml,arb}"
      run: dart tool/l10n.dart && flutter analyze --fatal-infos --fatal-warnings
    - name: segreti
      run: gitleaks git --pre-commit --staged --redact --no-banner

commit-msg:
  jobs:
    - name: messaggio secondo la convenzione Angular
      run: dart tool/check_commit_msg.dart {1}

# Prima del push i soli test collegati ai file modificati: la suite completa è in CI.
pre-push:
  parallel: true
  jobs:
    - name: nome del ramo
      # git passa su stdin i rami di destinazione: si controllano quelli.
      use_stdin: true
      run: dart tool/check_branch_name.dart --pre-push
    - name: messaggi dei commit del ramo
      run: |
        git fetch -q origin main || true
        dart tool/check_commit_msg.dart --range "$(git merge-base origin/main HEAD)..HEAD"
    - name: documentazione
      run: dart tool/check_docs.dart
    - name: commenti
      run: dart tool/check_comments.dart
    - name: nessun sottomodulo nell'indice
      run: "! git ls-files -s | grep -q '^160000'"
    - name: test dei file modificati
      # La suite completa e i golden (dipendono dal sistema operativo) girano in CI.
      run: tool/test_veloci.sh
