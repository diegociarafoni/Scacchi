name: scacchi
description: "Scacchi offline, open source e gratuito"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  dartchess: ^0.14.0
  chessground: ^10.3.0
  multistockfish: ^0.6.1
  path_provider: ^2.1.6
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  audioplayers: ^6.8.1
  intl: any
  flutter_local_notifications: ^22.3.1
  timezone: ^0.11.1
  flutter_zxing: ^3.1.0
  qr: ^4.0.0
  cryptography: ^2.9.0
  crypto: ^3.0.7
  image_picker: ^1.2.4
  bip340: ^0.3.1
  workmanager: ^0.10.10
  bluetooth_low_energy: ^6.0.0
  bonsoir: ^7.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  generate: true

  uses-material-design: true
  assets:
    - assets/sounds/
    - assets/puzzles/
    - assets/openings/
    - assets/boards/
    - assets/pieces/arcano/
    - assets/pieces/noto/
    - assets/pieces/papercut/
    - assets/pieces/pixel/
    - assets/pieces/rokko/
    - assets/pieces/halo/arcano/
    - assets/pieces/halo/cburnett/
    - assets/pieces/halo/celtic/
    - assets/pieces/halo/chessnut/
    - assets/pieces/halo/fantasy/
    - assets/pieces/halo/firi/
    - assets/pieces/halo/kiwenSuwi/
    - assets/pieces/halo/merida/
    - assets/pieces/halo/mpchess/
    - assets/pieces/halo/noto/
    - assets/pieces/halo/papercut/
    - assets/pieces/halo/pixel/
    - assets/pieces/halo/rhosgfx/
    - assets/pieces/halo/rokko/
    - assets/pieces/halo/shapes/
    - assets/pieces/halo/spatial/
    - assets/pieces/halo/totoy/
