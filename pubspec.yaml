name: scacchi
description: "Scacchi offline, open source e gratuito"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  dartchess: ^0.14.0
  chessground: ^10.3.0
  path_provider: ^2.1.6
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  audioplayers: ^6.8.1
  intl: any
  flutter_local_notifications: ^22.3.1
  timezone: ^0.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter

flutter:
  generate: true

  uses-material-design: true
  assets:
    - assets/sounds/
    - assets/puzzles/
    - assets/openings/
