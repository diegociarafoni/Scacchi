name: E2E Android

# Test end-to-end su un emulatore Android (x86_64, KVM). Pesante: gira su main,
# a richiesta e sulle PR che toccano questo workflow, i test end-to-end, Android o le dipendenze. I test su desktop Linux
# restano in ci.yml; qui si prova l'app compilata per Android, con la
# libreria nativa di Stockfish.
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md', 'LICENSE']
  pull_request:
    paths:
      - '.github/workflows/e2e-android.yml'
      - 'integration_test/**'
      - 'android/**'
      - 'pubspec.*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-android-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  emulatore:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Solo x86_64: è l'ABI dell'emulatore, le altre due raddoppiano la compilazione nativa.
      SCACCHI_NATIVE_ABIS: x86_64
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 400M
      CCACHE_COMPILERCHECK: content
      SYSTEM_IMAGE: system-images;android-34;default;x86_64
      # Cartella dell'AVD esplicita: sul runner ANDROID_AVD_HOME può puntare altrove.
      ANDROID_AVD_HOME: ${{ github.workspace }}/.avd
    steps:
      - run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift /usr/local/share/boost /opt/hostedtoolcache/CodeQL && df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: command -v ccache || (sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ccache)
      # Restore e save separati: la cache nativa si salva anche se i test falliscono.
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .ccache
          key: ccache-e2e-android-${{ hashFiles('pubspec.lock') }}
          restore-keys: ccache-e2e-android-
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            /usr/local/lib/android/sdk/ndk/28.2.13676358
            /usr/local/lib/android/sdk/cmake/3.22.1
            /usr/local/lib/android/sdk/system-images/android-34
          key: android-sdk-e2e-ndk28c-cmake3.22.1-${{ env.SYSTEM_IMAGE }}
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
      - run: dart tool/l10n.dart --solo-unione
      - run: flutter pub get

      # L'emulatore ha bisogno di KVM: sul runner si apre l'accesso al dispositivo.
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Immagine di sistema e AVD
        run: |
          sdk="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export PATH="$sdk/cmdline-tools/latest/bin:$sdk/emulator:$sdk/platform-tools:$PATH"
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "emulator" "platform-tools" "$SYSTEM_IMAGE" > /dev/null
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | avdmanager create avd --force --name ci --device pixel_6 --package "$SYSTEM_IMAGE"

      - name: Avvio dell'emulatore
        run: |
          sdk="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export PATH="$sdk/emulator:$sdk/platform-tools:$PATH"
          nohup emulator -avd ci -no-window -no-audio -no-boot-anim -no-snapshot \
            -gpu swiftshader_indirect -accel on > emulator.log 2>&1 &
          emulator_pid=$!
          for _ in $(seq 1 90); do
            if ! kill -0 "$emulator_pid" 2>/dev/null; then
              tail -50 emulator.log; echo "::error::l'emulatore si è fermato all'avvio"; exit 1
            fi
            [ "$(timeout 10 adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ] && break
            sleep 5
          done
          if [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" != "1" ]; then
            tail -50 emulator.log; echo "::error::l'emulatore non si è avviato"; exit 1
          fi

      # Un file alla volta, come su desktop. Solo i test che non dipendono dal desktop
      # (niente Stockfish di sistema, niente fotocamera).
      - name: Test end-to-end
        timeout-minutes: 25
        run: |
          failed=0
          for f in app_test portrait_test weekly_summary_test; do
            timeout 600 flutter test "integration_test/$f.dart" -d emulator-5554 || failed=1
          done
          exit "$failed"

      - name: Log dell'emulatore
        if: failure()
        run: tail -100 emulator.log || true

      - name: Statistiche di ccache
        if: '!cancelled()'
        run: ccache -s || true

      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        if: '!cancelled()'
        with:
          path: .ccache
          key: ccache-e2e-android-${{ hashFiles('pubspec.lock') }}-${{ github.run_id }}
