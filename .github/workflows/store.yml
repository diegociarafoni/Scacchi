name: Store

# Controllo manuale della chiave di Google Play con Fastlane (android/fastlane).
# Non carica nulla: il caricamento (corsia «interna») si aggiunge quando i segreti
# elencati in docs/store.md saranno inseriti. Senza segreti il workflow si ferma
# con un avviso e non fallisce.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  convalida:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Segreti presenti
        id: segreti
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "::warning::PLAY_SERVICE_ACCOUNT_JSON non è impostato: vedi docs/store.md"
            echo "presente=false" >> "$GITHUB_OUTPUT"
          else
            echo "presente=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.segreti.outputs.presente == 'true'
        uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - if: steps.segreti.outputs.presente == 'true'
        name: Convalida della chiave di Google Play
        working-directory: android
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          BUNDLE_GEMFILE: ${{ github.workspace }}/Gemfile
        run: bundle exec fastlane convalida
