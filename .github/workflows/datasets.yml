name: Dataset

# Regenerates the curated Lichess datasets and commits them to the PR branch
# when the builder scripts change.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - tool/datasets/**

permissions:
  contents: write

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: pip install chess==1.10.0
      - name: Puzzles
        run: |
          mkdir -p assets/puzzles
          curl -sSfL https://database.lichess.org/lichess_db_puzzle.csv.zst \
            | zstd -dc | python3 tool/datasets/build_puzzles.py > assets/puzzles/puzzles.csv
      - name: Openings
        run: python3 tool/datasets/build_openings.py > assets/openings/openings.tsv
      # Statistiche per mossa dalle partite pubbliche (CC0). Il dump è in ordine
      # cronologico: si legge solo l'inizio e poi si chiude il flusso, quindi
      # curl e zstd terminano per SIGPIPE e si controlla solo lo script.
      - name: Opening statistics
        shell: bash
        run: |
          python3 -m unittest discover -s tool/datasets -p 'test_*.py'
          curl -sSfL https://database.lichess.org/standard/lichess_db_standard_rated_2025-01.pgn.zst \
            | zstd -dc \
            | python3 tool/datasets/build_opening_stats.py --max-games 6000000 --min-games 200 \
            > assets/openings/opening_stats.tsv
          status=("${PIPESTATUS[@]}")
          [ "${status[2]}" -eq 0 ]
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
      # This commit does not trigger CI: validate the datasets here.
      - run: dart tool/l10n.dart --solo-unione
      - name: Validate
        run: flutter test test/puzzles/puzzle_dataset_test.dart test/openings/opening_book_test.dart test/openings/opening_stats_asset_test.dart
      # Il token si usa solo nel push, senza restare nella configurazione di git.
      - name: Commit
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          git add assets/puzzles assets/openings
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build(datasets): dataset lichess rigenerati"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/${BRANCH}"
