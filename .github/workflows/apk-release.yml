name: Rilascio APK

# Un solo job (ogni job si paga arrotondato al minuto) e nessuna esecuzione sulle PR:
# la build Android delle PR è già nella CI.
on:
  push:
    tags: ['v*']
  # Ogni CI verde su main aggiorna la pre-release "nightly" (link fisso, APK sempre l'ultima).
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Versione da pubblicare (es. 0.1.0): crea il tag v<versione> sul commit scelto. Vuoto = solo artefatto.'
        required: false
        default: ''

permissions:
  contents: read

# Una build in corso non si annulla (con merge ravvicinati non finirebbe mai): resta in attesa
# solo l'ultima, che parte al termine della precedente. I nightly e le versioni numerate
# hanno gruppi separati.
concurrency:
  group: apk-release-${{ github.event_name == 'workflow_run' && 'nightly' || 'versione' }}
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      # Per leggere l'esito della CI sullo stesso commit.
      actions: read
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Per il nightly si compila il commit che la CI ha verificato.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          # La cronologia completa serve per il versionCode.
          fetch-depth: 0

      - name: Versione
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          EVENT: ${{ github.event_name }}
        run: |
          sha="$(git rev-parse HEAD)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          if [ "$EVENT" = "workflow_run" ]; then
            echo "tag=nightly" >> "$GITHUB_OUTPUT"
            echo "name=nightly-${sha:0:7}" >> "$GITHUB_OUTPUT"
            echo "code=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            tag="$GITHUB_REF_NAME"
          elif [ -n "$INPUT_VERSION" ]; then
            tag="v${INPUT_VERSION#v}"
          else
            tag=""
          fi
          if [ -n "$tag" ] && ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag non valido: $tag (atteso vX.Y.Z o vX.Y.Z-suffisso)"; exit 1
          fi
          # Un tag esistente deve puntare al commit che si compila.
          if [ -n "$tag" ] && git rev-parse -q --verify "refs/tags/$tag" > /dev/null; then
            tagged="$(git rev-list -n1 "$tag")"
            if [ "$tagged" != "$sha" ]; then
              echo "::error::$tag punta già a $tagged, non a $sha"; exit 1
            fi
          fi
          name="${tag#v}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "name=${name:-0.0.0-dev}" >> "$GITHUB_OUTPUT"
          # Cresce con la cronologia, indipendente dal nome del workflow.
          echo "code=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"

      # I test girano qui solo se la CI non li ha già superati su questo commit.
      - name: Esito della CI sul commit
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.version.outputs.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          # Il nightly parte da una CI riuscita: nessun controllo da rifare.
          if [ "$EVENT" = "workflow_run" ]; then echo "passed=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          passed="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$SHA" \
            --status success --json databaseId --jq 'length' || echo 0)"
          echo "passed=$([ "${passed:-0}" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      # Il runner standard non ha spazio sufficiente per la build release con il motore nativo.
      - name: Spazio su disco
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost

      # La cache di Gradle viene solo da main (le PR non la scrivono per i tag) e
      # contiene dipendenze verificate da Gradle: accettabile per i rilasci.
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 17
          cache: gradle # zizmor: ignore[cache-poisoning]
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
      - run: dart tool/l10n.dart --solo-unione
      - run: flutter pub get
      # Come nella CI: i test con il motore vero girano solo se Stockfish c'è.
      - if: steps.ci.outputs.passed != 'true'
        run: sudo apt-get update && sudo apt-get install -y stockfish
      - if: steps.ci.outputs.passed != 'true'
        run: flutter analyze && flutter test

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet 'cryptography==44.0.2'
      - if: steps.ci.outputs.passed != 'true'
        name: Test della chiave derivata
        run: python -m unittest discover -s tool -p 'test_*keystore*.py'

      # Firma e build nello stesso passo: password e chiave non restano
      # nell'ambiente dei passi successivi. Solo arm64: tutti i telefoni Android
      # recenti, metà del tempo di build e un APK molto più piccolo.
      - name: Build APK release firmato
        env:
          BUILD_NAME: ${{ steps.version.outputs.name }}
          BUILD_NUMBER: ${{ steps.version.outputs.code }}
          SEED: ${{ secrets.ANDROID_SIGNING_SEED }}
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          # Come in ci.yml: senza filtro i plugin compilano e impacchettano le librerie
          # native anche per armeabi-v7a e x86_64, inutili in un APK arm64 (circa 15 MB).
          SCACCHI_NATIVE_ABIS: arm64-v8a
        run: |
          keystore="$RUNNER_TEMP/release.p12"
          trap 'rm -f "$keystore"' EXIT
          if [ -n "$KEYSTORE_BASE64" ]; then
            if [ -n "$SEED" ]; then
              echo "::warning::Ci sono sia ANDROID_KEYSTORE_BASE64 sia ANDROID_SIGNING_SEED: si usa il keystore. Togliere il keystore cambia la firma degli APK."
            fi
            echo "$KEYSTORE_BASE64" | base64 -d > "$keystore"
            export ANDROID_KEYSTORE_PASSWORD="$KEYSTORE_PASSWORD"
            export ANDROID_KEY_ALIAS="$KEY_ALIAS" ANDROID_KEY_PASSWORD="$KEY_PASSWORD"
          elif [ -n "$SEED" ]; then
            password="$(ANDROID_SIGNING_SEED="$SEED" python tool/derive_keystore.py "$keystore")"
            echo "::add-mask::$password"
            export ANDROID_KEYSTORE_PASSWORD="$password"
            export ANDROID_KEY_ALIAS=scacchi ANDROID_KEY_PASSWORD="$password"
          else
            echo "::warning::Nessun segreto di firma: APK firmato con la chiave di debug del runner."
          fi
          if [ -s "$keystore" ]; then export ANDROID_KEYSTORE_PATH="$keystore"; fi
          flutter build apk --release --target-platform android-arm64 \
            --build-name="$BUILD_NAME" --build-number="$BUILD_NUMBER"
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/rokko.apk
          (cd dist && sha256sum rokko.apk > rokko.apk.sha256)

      - name: Controlli MASVS sul manifest dell'APK
        run: dart run tool/check_apk.dart build/app/outputs/flutter-apk/app-release.apk

      - name: Budget di dimensione dell'APK
        run: dart run tool/check_size.dart build/app/outputs/flutter-apk/app-release.apk

      # Anche per le versioni numerate: il job di attestazione scarica da qui il file da attestare.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rokko-apk
          path: dist/
          retention-days: 7

      - name: Rilascio GitHub
        if: steps.version.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.version.outputs.tag }}
          SHA: ${{ steps.version.outputs.sha }}
          SIGNED: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' || secrets.ANDROID_SIGNING_SEED != '' }}
        run: |
          if [ "$SIGNED" = "true" ]; then
            signing="Firmato con la chiave stabile del progetto: si installa sopra le versioni precedenti firmate con la stessa chiave."
          else
            signing="Firmato con una chiave di debug generata dalla build: per installare una versione successiva bisogna prima disinstallare questa."
          fi
          cat > notes.md <<NOTES
          Installazione su Android (telefoni a 64 bit): aprire dal telefono il file **rokko.apk** qui sotto, consentire l'installazione da questa origine e confermare.

          $signing

          Istruzioni complete: docs/rilascio-android.md
          NOTES
          if [ "$TAG" = "nightly" ]; then
            # Un nightly non deve mai tornare indietro: Android rifiuta un APK con versionCode
            # più basso («App non installata»). Non si pubblica un commit che è un antenato
            # del nightly attuale o di una release numerata (anche con suffisso).
            # La build può durare a lungo: si rileggono i tag, che nel frattempo possono essere cambiati.
            auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
            git -c "http.extraheader=AUTHORIZATION: basic $auth" fetch -q --tags --force \
              "https://github.com/$GH_REPO.git" || echo "::warning::Tag non aggiornati: controllo sui tag scaricati all'inizio"
            for ref in nightly $(git tag -l 'v*'); do
              other="$(git rev-parse -q --verify "refs/tags/$ref^{commit}" || true)"
              [ -n "$other" ] && [ "$other" != "$SHA" ] || continue
              if git merge-base --is-ancestor "$SHA" "$other"; then
                echo "::notice::Nightly saltato: ${SHA:0:7} è indietro rispetto a $ref"; exit 0
              fi
            done
            cat > notes.md <<NOTES
          Versione di prova aggiornata a ogni modifica di \`main\` che supera la CI (commit \`${SHA:0:7}\`). Si installa sopra qualunque versione firmata con la stessa chiave.

          $signing

          Per una versione stabile usare l'ultima release numerata.
          NOTES
            # La release resta la stessa (stesso indirizzo, nessuna notifica): cambiano file, tag e note.
            if gh release view nightly > /dev/null 2>&1; then
              gh release upload nightly dist/* --clobber
              gh api -X PATCH "repos/$GH_REPO/git/refs/tags/nightly" -f sha="$SHA" -F force=true > /dev/null
              gh release edit nightly --title "Rokko nightly ${SHA:0:7}" --notes-file notes.md
            else
              gh release create nightly dist/* --target "$SHA" --prerelease \
                --title "Rokko nightly ${SHA:0:7}" --notes-file notes.md
            fi
          elif [ -n "$(gh release list --json tagName,isDraft --jq ".[] | select(.tagName == \"$TAG\" and .isDraft) | .tagName")" ]; then
            # Bozza creata da release-please (con il changelog come note): si allega l'APK e la
            # si pubblica qui, cioè quando la versione viene richiesta. Come sotto, le versioni
            # con suffisso restano pre-release.
            publish="--draft=false"
            case "$TAG" in *-*) publish="$publish --prerelease" ;; esac
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" $publish
          elif gh release view "$TAG" > /dev/null 2>&1; then
            # Il passo Versione ha già verificato che il tag punti a questo commit.
            gh release upload "$TAG" dist/* --clobber
          else
            prerelease=""
            # Le pre-release non compaiono in releases/latest: solo i tag con suffisso lo sono.
            case "$TAG" in *-*) prerelease="--prerelease" ;; esac
            gh release create "$TAG" dist/* --target "$SHA" \
              --title "Rokko ${TAG#v}" --notes-file notes.md $prerelease
          fi

  # Job a parte: solo qui esistono i permessi per firmare l'attestazione, così nessun
  # passo della build (che ha le chiavi di firma e dipendenze di terzi) può usarli.
  # Le attestazioni riguardano le versioni numerate; il nightly è sostituito a ogni merge
  # e può essere saltato se un commit più recente l'ha già superato.
  attestazione:
    needs: release
    if: needs.release.outputs.tag != '' && needs.release.outputs.tag != 'nightly'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rokko-apk
          path: dist
      # Prova pubblica che l'APK è stato costruito da questo workflow:
      # gh attestation verify rokko.apk --repo diegociarafoni/rokko
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/rokko.apk
