name: Rilascio APK

on:
  push:
    tags: ['v*']
  # Verifica la build release quando cambia la sua configurazione, senza pubblicare.
  pull_request:
    paths: ['.github/workflows/apk-release.yml', 'android/**', 'tool/*keystore*.py']
  workflow_dispatch:
    inputs:
      version:
        description: 'Versione da pubblicare (es. 0.1.0): crea il tag v<versione> sul commit scelto. Vuoto = solo artefatto.'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: apk-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          # La cronologia completa serve per il versionCode.
          fetch-depth: 0

      - name: Versione
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            tag="$GITHUB_REF_NAME"
          elif [ -n "$INPUT_VERSION" ]; then
            tag="v${INPUT_VERSION#v}"
          else
            tag=""
          fi
          if [ -n "$tag" ] && ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag non valido: $tag (atteso vX.Y.Z o vX.Y.Z-suffisso)"; exit 1
          fi
          # Un tag esistente deve puntare al commit che si compila.
          if [ -n "$tag" ] && git rev-parse -q --verify "refs/tags/$tag" > /dev/null; then
            tagged="$(git rev-list -n1 "$tag")"
            if [ "$tagged" != "$GITHUB_SHA" ]; then
              echo "::error::$tag punta già a $tagged, non a $GITHUB_SHA"; exit 1
            fi
          fi
          name="${tag#v}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "name=${name:-0.0.0-dev}" >> "$GITHUB_OUTPUT"
          # Cresce con la cronologia, indipendente dal nome del workflow.
          echo "code=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"

      # Il runner standard non ha spazio sufficiente per la build release con il motore nativo.
      - name: Spazio su disco
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test della chiave derivata
        run: |
          python -m pip install --quiet 'cryptography==44.0.2'
          python -m unittest discover -s tool -p 'test_*keystore*.py'

      # Firma e build nello stesso passo: password e chiave non restano
      # nell'ambiente dei passi successivi. Sulle PR una frase pubblica verifica
      # il percorso di firma senza esporre segreti, e l'APK non viene caricato.
      - name: Build APK release firmato
        env:
          BUILD_NAME: ${{ steps.version.outputs.name }}
          BUILD_NUMBER: ${{ steps.version.outputs.code }}
          IS_PR: ${{ github.event_name == 'pull_request' }}
          SEED: ${{ github.event_name == 'pull_request' && 'frase pubblica, serve solo a verificare le pull request' || secrets.ANDROID_SIGNING_SEED }}
          KEYSTORE_BASE64: ${{ github.event_name != 'pull_request' && secrets.ANDROID_KEYSTORE_BASE64 || '' }}
          KEYSTORE_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.ANDROID_KEYSTORE_PASSWORD || '' }}
          KEY_ALIAS: ${{ github.event_name != 'pull_request' && secrets.ANDROID_KEY_ALIAS || '' }}
          KEY_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.ANDROID_KEY_PASSWORD || '' }}
        run: |
          keystore="$RUNNER_TEMP/release.p12"
          trap 'rm -f "$keystore"' EXIT
          if [ -n "$KEYSTORE_BASE64" ]; then
            if [ -n "$SEED" ] && [ "$IS_PR" != "true" ]; then
              echo "::warning::Ci sono sia ANDROID_KEYSTORE_BASE64 sia ANDROID_SIGNING_SEED: si usa il keystore. Togliere il keystore cambia la firma degli APK."
            fi
            echo "$KEYSTORE_BASE64" | base64 -d > "$keystore"
            export ANDROID_KEYSTORE_PASSWORD="$KEYSTORE_PASSWORD"
            export ANDROID_KEY_ALIAS="$KEY_ALIAS" ANDROID_KEY_PASSWORD="$KEY_PASSWORD"
          elif [ -n "$SEED" ]; then
            password="$(ANDROID_SIGNING_SEED="$SEED" python tool/derive_keystore.py "$keystore")"
            echo "::add-mask::$password"
            export ANDROID_KEYSTORE_PASSWORD="$password"
            export ANDROID_KEY_ALIAS=scacchi ANDROID_KEY_PASSWORD="$password"
          else
            echo "::warning::Nessun segreto di firma: APK firmato con la chiave di debug del runner."
          fi
          if [ -s "$keystore" ]; then export ANDROID_KEYSTORE_PATH="$keystore"; fi
          flutter build apk --release --build-name="$BUILD_NAME" --build-number="$BUILD_NUMBER"
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/scacchi.apk
          (cd dist && sha256sum scacchi.apk > scacchi.apk.sha256)

      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: scacchi-apk
          path: dist/

  publish:
    needs: build
    if: needs.build.outputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.build.outputs.tag }}
      SIGNED: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' || secrets.ANDROID_SIGNING_SEED != '' }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: scacchi-apk
          path: dist
      - name: Rilascio GitHub
        run: |
          if [ "$SIGNED" = "true" ]; then
            signing="Firmato con la chiave di rilascio del progetto."
          else
            signing="Firmato con una chiave di debug generata dalla build: per installare una versione successiva bisogna prima disinstallare questa."
          fi
          cat > notes.md <<NOTES
          Installazione su Android: aprire dal telefono il file **scacchi.apk** qui sotto, consentire l'installazione da questa origine e confermare.

          $signing

          Istruzioni complete: docs/rilascio-android.md
          NOTES
          if gh release view "$TAG" > /dev/null 2>&1; then
            # Il job di build ha già verificato che il tag punti a questo commit.
            gh release upload "$TAG" dist/* --clobber
          else
            prerelease=""
            # Le pre-release non compaiono in releases/latest: solo i tag con suffisso lo sono.
            case "$TAG" in *-*) prerelease="--prerelease" ;; esac
            gh release create "$TAG" dist/* --target "$GITHUB_SHA" \
              --title "Scacchi ${TAG#v}" --notes-file notes.md $prerelease
          fi
