name: CI

# Minuti di Actions contati: vedi "Consumo di minuti" in docs/sviluppo.md.
# Sulle PR girano sempre analisi, formattazione e test; e2e e build Android solo
# su main, con l'etichetta ci-completa (ci-completa.yml) o quando la PR tocca i
# file che li riguardano. Nella coda di merge (merge_group) la stessa regola vale
# per i file del gruppo: i controlli obbligatori girano sul risultato dell'unione.
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md', 'LICENSE']
  pull_request:
    paths-ignore: ['docs/**', '**/*.md', 'LICENSE']
  merge_group:
  workflow_call:

permissions:
  contents: read

# Un nuovo push sulla stessa PR annulla il giro precedente. Su main e nella coda
# di merge ogni commit ha un gruppo a sé: nessun giro viene annullato, neanche
# se in attesa.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # Elenco dei file della PR, per decidere i job pesanti.
      pull-requests: read
    outputs:
      e2e: ${{ steps.scope.outputs.e2e }}
      android: ${{ steps.scope.outputs.android }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Job pesanti necessari
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          # Nella coda di merge si confronta il gruppo con la base su main.
          RANGE: ${{ github.event.merge_group.base_sha }}...${{ github.event.merge_group.head_sha }}
          FULL: ${{ contains(github.event.pull_request.labels.*.name, 'ci-completa') }}
        run: |
          if { [ "$EVENT" != "pull_request" ] && [ "$EVENT" != "merge_group" ]; } || [ "$FULL" = "true" ]; then
            echo "e2e=true" >> "$GITHUB_OUTPUT"
            echo "android=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$EVENT" = "merge_group" ]; then
            files="$(gh api "repos/$GITHUB_REPOSITORY/compare/$RANGE" --paginate --jq '.files[].filename' || true)"
            # Senza l'elenco dei file nella coda si esegue tutto.
            if [ -z "$files" ]; then
              echo "e2e=true" >> "$GITHUB_OUTPUT"
              echo "android=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          else
            files="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --paginate --jq '.[].filename')"
          fi
          has() { grep -qE "$1" <<< "$files" && echo true || echo false; }
          echo "e2e=$(has '^(integration_test/|linux/|pubspec\.(yaml|lock)$|\.github/workflows/ci(-completa)?\.yml$)')" >> "$GITHUB_OUTPUT"
          echo "android=$(has '^(android/|tool/(check_apk\.dart|policy\.json|src/)|pubspec\.(yaml|lock)$|\.github/workflows/ci(-completa)?\.yml$)')" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
      - run: sudo apt-get update && sudo apt-get install -y stockfish
      # I testi tradotti non sono nel repository: si uniscono i file per funzione
      # (e si controlla che le lingue coincidano) prima di pub get, che genera il codice.
      - run: dart tool/l10n.dart --solo-unione
      # I testi italiani scritti nel codice non possono aumentare (tool/stringhe_fisse_base.json).
      - run: dart tool/stringhe_fisse.dart
      # Una lingua «pronta» in tool/lingue.json deve avere tutte le chiavi.
      - run: dart tool/l10n_stato.dart
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test integration_test tool
      # Regole rigorose in analysis_options.yaml: anche gli avvisi informativi bloccano.
      - run: flutter analyze --fatal-infos --fatal-warnings
      - run: flutter test --coverage
      - name: Copertura della logica di gioco
        run: dart run tool/check_coverage.dart
      - name: Licenze delle dipendenze compatibili con GPL-3.0
        run: dart run tool/check_licenses.dart

  e2e:
    runs-on: ubuntu-latest
    needs: test
    if: needs.test.outputs.e2e == 'true'
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev ninja-build xvfb libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev gstreamer1.0-plugins-base gstreamer1.0-plugins-good stockfish
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
      - run: dart tool/l10n.dart --solo-unione
      # Su desktop un file alla volta: con più file l'avvio del secondo fallisce.
      - run: |
          failed=0
          for f in integration_test/*_test.dart; do
            xvfb-run -a flutter test "$f" -d linux || { echo "::error file=$f::test di integrazione fallito"; failed=1; }
          done
          exit $failed

  android:
    runs-on: ubuntu-latest
    needs: test
    if: needs.test.outputs.android == 'true'
    timeout-minutes: 30
    env:
      # La compilazione nativa di Stockfish (tre librerie) è il grosso del tempo:
      # ccache la salta per i file C++ non cambiati, cmake lo usa da queste variabili.
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 400M
      CCACHE_COMPILERCHECK: content
      # Solo arm64, come l'APK di rilascio, anche per le librerie dei plugin.
      SCACCHI_NATIVE_ABIS: arm64-v8a
    steps:
      # Spazio per NDK e compilazione nativa di Stockfish: si rimuovono toolchain non usate.
      - run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift /usr/local/share/boost /opt/hostedtoolcache/CodeQL && df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: command -v ccache || (sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ccache)
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .ccache
          # I sorgenti compilati cambiano solo con le versioni dei plugin: una voce per pubspec.lock.
          key: ccache-android-${{ hashFiles('pubspec.lock') }}
          restore-keys: ccache-android-
      # NDK e CMake sono scaricati e decompressi a ogni giro se mancano.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            /usr/local/lib/android/sdk/ndk/28.2.13676358
            /usr/local/lib/android/sdk/cmake/3.22.1
          key: android-sdk-ndk28c-cmake3.22.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
      - run: dart tool/l10n.dart --solo-unione
      - run: flutter build apk --debug --target-platform android-arm64
      - name: Controlli MASVS sul manifest dell'APK
        run: dart run tool/check_apk.dart --debug build/app/outputs/flutter-apk/app-debug.apk
      - name: Statistiche di ccache
        if: success()
        run: ccache -s
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scacchi-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
