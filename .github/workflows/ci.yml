name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
      - run: sudo apt-get update && sudo apt-get install -y stockfish
      - run: flutter pub get
      - run: flutter gen-l10n && git diff --exit-code lib/l10n
      - run: dart format --output=none --set-exit-if-changed lib test integration_test tool
      # Regole rigorose in analysis_options.yaml: anche gli avvisi informativi bloccano.
      - run: flutter analyze --fatal-infos --fatal-warnings
      - run: flutter test

  e2e:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev ninja-build xvfb libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev gstreamer1.0-plugins-base gstreamer1.0-plugins-good stockfish
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
      # Su desktop un file alla volta: con più file l'avvio del secondo fallisce.
      - run: |
          for f in integration_test/*_test.dart; do
            xvfb-run -a flutter test "$f" -d linux
          done

  android:
    runs-on: ubuntu-latest
    needs: test
    steps:
      # Spazio per NDK e compilazione nativa di Stockfish: si rimuovono toolchain non usate.
      - run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift /usr/local/share/boost /opt/hostedtoolcache/CodeQL && df -h /
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: scacchi-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
