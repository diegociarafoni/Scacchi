name: CI

# Minuti di Actions contati: vedi "Consumo di minuti" in docs/sviluppo.md.
# Sulle PR girano sempre analisi, formattazione e test; e2e e build Android solo
# su main, con l'etichetta ci-completa (ci-completa.yml) o quando la PR tocca i
# file che li riguardano.
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md', 'LICENSE']
  pull_request:
    paths-ignore: ['docs/**', '**/*.md', 'LICENSE']
  workflow_call:

permissions:
  contents: read

# Un nuovo push sulla stessa PR annulla il giro precedente. Su main ogni commit ha
# un gruppo a sé: nessun giro viene annullato, neanche se in attesa.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # Elenco dei file della PR, per decidere i job pesanti.
      pull-requests: read
    outputs:
      e2e: ${{ steps.scope.outputs.e2e }}
      android: ${{ steps.scope.outputs.android }}
    steps:
      - uses: actions/checkout@v4
      - name: Job pesanti necessari
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          FULL: ${{ contains(github.event.pull_request.labels.*.name, 'ci-completa') }}
        run: |
          if [ "$EVENT" != "pull_request" ] || [ "$FULL" = "true" ]; then
            echo "e2e=true" >> "$GITHUB_OUTPUT"
            echo "android=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --paginate --jq '.[].filename')"
          has() { grep -qE "$1" <<< "$files" && echo true || echo false; }
          echo "e2e=$(has '^(integration_test/|linux/|pubspec\.(yaml|lock)$|\.github/workflows/ci(-completa)?\.yml$)')" >> "$GITHUB_OUTPUT"
          echo "android=$(has '^(android/|pubspec\.(yaml|lock)$|\.github/workflows/ci(-completa)?\.yml$)')" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
      - run: sudo apt-get update && sudo apt-get install -y stockfish
      - run: flutter pub get
      - run: flutter gen-l10n && git diff --exit-code lib/l10n
      - run: dart format --output=none --set-exit-if-changed lib test integration_test tool
      # Regole rigorose in analysis_options.yaml: anche gli avvisi informativi bloccano.
      - run: flutter analyze --fatal-infos --fatal-warnings
      - run: flutter test

  e2e:
    runs-on: ubuntu-latest
    needs: test
    if: needs.test.outputs.e2e == 'true'
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev ninja-build xvfb libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev gstreamer1.0-plugins-base gstreamer1.0-plugins-good stockfish
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
      # Su desktop un file alla volta: con più file l'avvio del secondo fallisce.
      - run: |
          for f in integration_test/*_test.dart; do
            xvfb-run -a flutter test "$f" -d linux
          done

  android:
    runs-on: ubuntu-latest
    needs: test
    if: needs.test.outputs.android == 'true'
    timeout-minutes: 30
    steps:
      # Spazio per NDK e compilazione nativa di Stockfish: si rimuovono toolchain non usate.
      - run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift /usr/local/share/boost /opt/hostedtoolcache/CodeQL && df -h /
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
      # Solo arm64, come l'APK di rilascio: metà della compilazione nativa.
      - run: flutter build apk --debug --target-platform android-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: scacchi-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
