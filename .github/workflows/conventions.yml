name: Convenzioni

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  # Nella coda di merge il controllo è obbligatorio ma già superato sulla PR:
  # il job si salta e per GitHub conta come riuscito.
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  conventions:
    name: Ramo, titolo della PR e commit
    # Modificare il titolo di una PR già unita rilancia il workflow, ma il
    # commit di testa non è più scaricabile con il ramo eliminato.
    if: github.event_name == 'pull_request' && github.event.pull_request.state == 'open'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
      - name: Nome del ramo
        env:
          BRANCH: ${{ github.head_ref }}
        run: dart tool/check_branch_name.dart "$BRANCH"
      # Con lo squash merge il titolo della PR diventa il commit su main.
      - name: Titolo della PR
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: dart tool/check_commit_msg.dart --text "$TITLE"
      - name: Messaggi dei commit
        # Dal punto in cui il ramo si stacca da main: i commit arrivati
        # unendo main non sono di questa PR.
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          base="$(git merge-base "origin/$BASE_REF" "$HEAD")"
          dart tool/check_commit_msg.dart --range "$base..$HEAD"
      - name: Segreti nei commit della PR (Gitleaks)
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          base="$(git merge-base "origin/$BASE_REF" "$HEAD")"
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --log-opts="$base..$HEAD" .
      # Gira anche sulle PR di sola documentazione, che ci.yml ignora.
      - name: Documentazione (link, percorsi, indice, mappa del codice)
        if: '!cancelled()'
        run: dart tool/check_docs.dart
      - name: Commenti nel codice (concorrenti, PR, promemoria senza motivo)
        if: '!cancelled()'
        run: dart tool/check_comments.dart
