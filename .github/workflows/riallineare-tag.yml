name: Riallinea tag e rami

# Operazione una tantum dopo la riscrittura della storia di main: sposta i tag
# sui nuovi commit ed elimina i rami di rilascio già confluiti. Idempotente.
on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  riallinea:
    name: Sposta i tag ed elimina i rami
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Sposta i tag sui nuovi commit
        run: |
          set -euo pipefail
          while read -r tag nuovo vecchio; do
            attuale="$(git rev-parse -q --verify "refs/tags/$tag^{commit}" || true)"
            if [ "$attuale" = "$nuovo" ]; then
              echo "= $tag già su ${nuovo:0:7}"; continue
            fi
            case "$attuale" in "$vecchio"*) ;; *)
              echo "✗ $tag punta a ${attuale:-niente}, atteso $vecchio o $nuovo" >&2; exit 1 ;;
            esac
            [ "$(git rev-parse "$nuovo^{tree}")" = "$(git rev-parse "$attuale^{tree}")" ] \
              || { echo "✗ $tag: alberi diversi" >&2; exit 1; }
            git merge-base --is-ancestor "$nuovo" origin/main \
              || { echo "✗ $tag: $nuovo non è in main" >&2; exit 1; }
            git push --force origin "$nuovo:refs/tags/$tag"
            echo "→ $tag: ${attuale:0:7} → ${nuovo:0:7}"
          done <<'TAGS'
          v0.5.0 6c9fb48a81bb141ce63f3217ab08db5e215b41ed 8ada368
          v0.6.0 65a3605be5c00a979f626ae66c856a213c420f6d d9011be
          v0.7.0 2bae4eaa594a4e72e2ea3974b3eaf23a0e86e1e9 4facb1e
          v0.8.0 f5b0099c18a9952752946440b6ac38fb5f7a92db a094c6e
          v0.8.1 31de9dc0a66c4d05cb09fd35d8b4e0710fa97be1 da9d0af
          v0.9.0 aab67cacf71a718e6d6ce52ad809ca74a87872d6 2e20b9b
          v0.10.0 8e0ede5ff4810ca72fa25c280700c204b9a46d3c 6d78018
          v0.11.0 937c4005be385a58eff094cbe74728c7ed6a8f58 eda10a5
          v0.12.0 17508c1ebaf018f299fa0e8212206eb2a781786b 8232353
          v0.13.0 ef9a282e139dbd5226feed9065d0fab737e67958 a0df79c
          v0.14.0 b33e416e6c7e971d688879c1c396ef36c6cc6922 ac0c040
          v0.14.1 c0ebc1b56c32589cc172757662795d23c2fa1a1b 6fa4bf2
          TAGS

      - name: Elimina i rami di rilascio
        run: |
          set -euo pipefail
          alberi="$(git log origin/main --format=%T)"
          for ramo in chore/rilascio-0-11-0 chore/rilascio-0-11-0-b chore/rilascio-0-12-0 \
                      chore/rilascio-0-13-0 chore/rilascio-0-14-0 chore/rilascio-0-14-1 ci/build-ios; do
            if ! git rev-parse -q --verify "refs/remotes/origin/$ramo" > /dev/null; then
              echo "= $ramo già assente"; continue
            fi
            aperte="$(gh pr list --head "$ramo" --state open --json number --jq length)"
            [ "$aperte" = 0 ] || { echo "✗ $ramo ha PR aperte" >&2; exit 1; }
            grep -qx "$(git rev-parse "origin/$ramo^{tree}")" <<<"$alberi" \
              || { echo "✗ $ramo: contenuto non presente in main" >&2; exit 1; }
            git push origin --delete "$ramo"
            echo "→ $ramo eliminato"
          done

      - name: Riepilogo
        run: |
          {
            echo "### Tag"
            git ls-remote --tags origin 'v*' | grep -v '\^{}' | sed 's/^/    /'
            echo "### Rami rimasti"
            git ls-remote --heads origin | sed 's/^/    /'
          } | tee -a "$GITHUB_STEP_SUMMARY"
